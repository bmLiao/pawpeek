name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run tests
        run: cargo test
      - name: Build release
        run: cargo build --release
      - name: Upload raw binary
        uses: actions/upload-artifact@v4
        with:
          name: pawpeek-macos-bin
          path: target/release/pawpeek
      - name: Package plugin zip
        run: |
          mkdir -p dist tmp
          cp -r .claude-plugin tmp/
          cp .claude-plugin/marketplace.json tmp/
          cp -r hooks tmp/
          cp -r commands tmp/
          cp -r assets tmp/
          cp PLUGIN.md tmp/
          cp README.md tmp/
          mkdir -p tmp/bin
          cp target/release/pawpeek tmp/bin/
          cd tmp && zip -r ../dist/pawpeek-plugin-macos.zip . && cd ..
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawpeek-macos
          path: dist/pawpeek-plugin-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run tests
        run: cargo test
      - name: Build release
        run: cargo build --release
      - name: Upload raw binary
        uses: actions/upload-artifact@v4
        with:
          name: pawpeek-windows-bin
          path: target/release/pawpeek.exe
      - name: Package plugin zip
        shell: pwsh
        run: |
          mkdir dist
          mkdir tmp
          Copy-Item -Recurse .claude-plugin tmp\.claude-plugin
          Copy-Item .claude-plugin\marketplace.json tmp\marketplace.json
          Copy-Item -Recurse hooks tmp\hooks
          Copy-Item -Recurse commands tmp\commands
          Copy-Item -Recurse assets tmp\assets
          Copy-Item PLUGIN.md tmp\
          Copy-Item README.md tmp\
          New-Item -ItemType Directory -Force tmp\bin
          Copy-Item target\release\pawpeek.exe tmp\bin\pawpeek.exe
          Compress-Archive -Path tmp\* -DestinationPath dist\pawpeek-plugin-windows.zip -Force
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawpeek-windows
          path: dist/pawpeek-plugin-windows.zip

  deploy:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download macos binary
        uses: actions/download-artifact@v4
        with:
          name: pawpeek-macos-bin
          path: /tmp/macos
      - name: Download windows binary
        uses: actions/download-artifact@v4
        with:
          name: pawpeek-windows-bin
          path: /tmp/windows
      - name: Commit binaries to bin/
        run: |
          mkdir -p bin
          # bin/pawpeek 是依作業系統轉交的啟動器（已在 repo 中），不可覆蓋
          cp /tmp/macos/pawpeek bin/pawpeek-macos
          cp /tmp/windows/pawpeek.exe bin/pawpeek.exe
          chmod +x bin/pawpeek bin/pawpeek-macos
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f bin/
          git diff --staged --quiet || (git commit -m "ci: deploy binaries" && git pull --rebase -X theirs origin main && git push)

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pawpeek-macos/pawpeek-plugin-macos.zip
            artifacts/pawpeek-windows/pawpeek-plugin-windows.zip
